[package]
name = "il2-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "openil2"
path = "src/main.rs"

[dependencies]
il2-vfs = { path = "../il2-vfs" }
il2-formats = { path = "../il2-formats" }
il2-data = { path = "../il2-data" }
il2-fm = { path = "../il2-fm" }
il2-render = { path = "../il2-render" }
glam = { version = "0.30", features = ["bytemuck"] }
winit = "0.30"
gilrs = { version = "0.11", optional = true }
clap = { version = "4", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["tga", "png"] }
libloading = "0.8"
ab_glyph = "0.2"

[features]
# Joystick/gamepad input; needs libudev headers (Fedora: systemd-devel).
gamepad = ["dep:gilrs"]
